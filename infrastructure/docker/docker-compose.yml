services:
  product-catalog-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in infrastructure/docker/.env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in infrastructure/docker/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infrastructure/docker/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - product-catalog-postgres-data:/var/lib/postgresql/data
    networks:
      - catalog-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-catalog-service:
    build:
      context: ../../services/product-catalog-service
    depends_on:
      product-catalog-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://product-catalog-db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks:
      - catalog-net

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in infrastructure/docker/.env}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME in infrastructure/docker/.env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in infrastructure/docker/.env}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in infrastructure/docker/.env}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME in infrastructure/docker/.env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in infrastructure/docker/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in infrastructure/docker/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in infrastructure/docker/.env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    networks:
      - keycloak-net
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  catalog-net:
  keycloak-net:

volumes:
  product-catalog-postgres-data:
  keycloak-postgres-data:
